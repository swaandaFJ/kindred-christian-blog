<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Writer Dashboard — Kindred</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="nav">
			<div class="nav-inner">
				<a href="index.html" class="nav-logo">Kindred</a>
				<div class="nav-actions" style="margin-left: auto">
					<a href="index.html" class="btn btn-outline btn-sm">← Back to site</a>
					<a class="logout-btn icon-btn" id="signout" aria-label="Logout">🚪</a>
				</div>
			</div>
		</header>

		<div class="studio">
			<aside class="studio-side">
				<div class="brand">Writer Studio</div>
				<a href="writer-dashboard.html" class="active">Dashboard</a>
				<a href="editor.html">New Article</a>
				<a href="#">My Profile</a>
			</aside>

			<main class="studio-main">
				<h1 style="font-size: 26px">Welcome back, Amara</h1>
				<p class="text-muted" style="margin-bottom: 24px">
					Here's where your writing stands.
				</p>

				<div class="stats-row">
					<div class="stat-card">
						<div class="num" id="statTotal">–</div>
						<div class="label">Total articles</div>
					</div>
					<div class="stat-card">
						<div class="num" id="statPublished">–</div>
						<div class="label">Published</div>
					</div>
					<div class="stat-card">
						<div class="num" id="statPending">–</div>
						<div class="label">Awaiting review</div>
					</div>
				</div>

				<div
					class="flex"
					style="justify-content: space-between; margin-bottom: 16px"
				>
					<h2 style="font-size: 19px; margin: 0">Your articles</h2>
					<a href="editor.html" class="btn btn-primary btn-sm">+ New article</a>
				</div>

				<div id="tableArea"></div>
			</main>
		</div>

		<script src="js/data.js"></script>
		<script src="js/app.js"></script>
		<script>
			document.getElementById("statTotal").textContent = WRITER_ARTICLES.length;
			document.getElementById("statPublished").textContent =
				WRITER_ARTICLES.filter((a) => a.status === "published").length;
			document.getElementById("statPending").textContent =
				WRITER_ARTICLES.filter((a) => a.status === "in_review").length;

			const area = document.getElementById("tableArea");

			if (WRITER_ARTICLES.length === 0) {
				area.innerHTML = emptyStateHTML(
					"✍️",
					"Your writing journey starts here",
					"You haven't submitted an article yet.",
					"Write your first article",
					"editor.html",
				);
			} else {
				area.innerHTML = `
      <table>
        <thead><tr><th>Title</th><th>Topic</th><th>Status</th><th>Updated</th><th></th></tr></thead>
        <tbody>
          ${WRITER_ARTICLES.map(
						(a) => `
            <tr class="clickable" onclick="location.href='editor.html?id=${a.id}'">
              <td>${a.title}</td>
              <td class="text-muted">${a.topic}</td>
              <td>${statusBadge(a.status)}</td>
              <td class="text-muted">${a.updated}</td>
              <td><a href="editor.html?id=${a.id}" onclick="event.stopPropagation()" style="font-weight:700;color:var(--clay-700)">Edit →</a></td>
            </tr>`,
					).join("")}
        </tbody>
      </table>`;
			}
		</script>
	</body>
</html>
